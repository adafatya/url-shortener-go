services:
  app:
    build: .
    ports:
      - "${APP_PORT}:${APP_PORT}"
    environment:
      - APP_PORT=${APP_PORT}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=#{DB_NAME}
