on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build:
    name: Run Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout
      - name: Setup Go
        uses: actions/setup-go
        with:
          go-version: '1.21'
          cache: true
      - name: Install Depedencies
        run: go mod download
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
